services:
  nginx-reverse-proxy:
    build: ../../nginx-reverse-proxy
    container_name: symfony_reverse-proxy
    depends_on:
      - php
    volumes:
      - ../../nginx-reverse-proxy/local.test.ru-rr.conf:/etc/nginx/conf.d/local.test.ru.conf
      - ../../log/nginx-reverse-proxy:/var/log/nginx
    ports:
      - "80:80"
    networks:
      app_net: